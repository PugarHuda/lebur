<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Lebur sealed orders">
  <title>Lebur</title>
  <circle cx="24" cy="24" r="24" fill="#12233d"/>
  <!-- sealed envelope: the order is submitted but unreadable -->
  <rect x="10" y="15" width="28" height="19" rx="3" fill="#7fb2ea"/>
  <path d="M10 18l14 10 14-10" fill="none" stroke="#12233d" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- wax seal -->
  <circle cx="34" cy="32" r="6" fill="#e8734a" stroke="#12233d" stroke-width="2"/>
</svg>
